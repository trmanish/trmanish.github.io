<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <title>{{ page.title }}{% unless page.title == site.title %} — {{ site.title }}{% endunless %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@400;600;700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/diary.css' | relative_url }}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWGCRLMXHK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JWGCRLMXHK');
  </script>
</head>
<body class="diary-home">
  <div class="diary-wash" aria-hidden="true"></div>
  <header class="diary-nav">
    <a class="diary-brand" href="{{ '/' | relative_url }}">Two Ticks</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/posts.html' | relative_url }}">All Ticks</a>
      <a href="{{ '/podcasts.html' | relative_url }}">Podcasts</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <button class="lamp-toggle" data-lamp type="button" aria-pressed="false" aria-label="Light the lamp">
    <span class="lamp-glow" aria-hidden="true"></span>
    <svg viewBox="0 0 44 70" aria-hidden="true">
      <path class="lamp-cord" d="M22 2 C26.5 2 26.5 8.5 22 8.5 C17.5 8.5 17.5 2 22 2 Z" fill="none"/>
      <line class="lamp-cord" x1="22" y1="8.5" x2="22" y2="13"/>
      <path class="lamp-shade" d="M15 21.5 L29 21.5 L26 13 L18 13 Z"/>
      <rect class="lamp-bulb" x="13.5" y="21.5" width="17" height="26" rx="3.5"/>
      <line class="lamp-cord" x1="16.5" y1="22.5" x2="16.5" y2="47"/>
      <line class="lamp-cord" x1="27.5" y1="22.5" x2="27.5" y2="47"/>
      <path class="lamp-flame" d="M22 29.5 C25 33.2 25 38.2 22 40.8 C19 38.2 19 33.2 22 29.5 Z"/>
      <path class="lamp-shade" d="M12.5 47.5 L31.5 47.5 L29.5 53 L14.5 53 Z"/>
    </svg>
  </button>

  <script src="{{ '/assets/js/diary.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/lamp.js' | relative_url }}" defer></script>
</body>
</html>
