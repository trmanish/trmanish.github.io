<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">

<body class="site-page site-page--post">
    <div class="site-wash" aria-hidden="true"></div>

    <header class="nav-bar">
        <nav>
            <a href="{{ "/" | relative_url }}" class="site-wordmark">Two Ticks</a>
            <a href="{{ "/posts.html" | relative_url }}" class="{% if page.url == '/posts.html' or page.layout == 'post' %}active{% endif %}">All Ticks</a>
            <a href="{{ "/podcasts.html" | relative_url }}" class="{% if page.url == '/podcasts.html' %}active{% endif %}">Podcasts</a>
        </nav>
    </header>

    <main class="site-main article-paper" style="max-width: 800px; margin: 40px auto; padding: 20px; text-align: left;">
        <p class="article-date">{{ page.date | date: "%B %d, %Y" }}</p>
        <div>
            {{ content }}
        </div>

        <div style="text-align: center; margin-top: 40px;">
            {% if page.previous %}
                <a href="{{ page.previous.url }}" style="margin-right: 20px;">← {{ page.previous.title }}</a>
            {% endif %}
            {% if page.next %}
                <a href="{{ page.next.url }}"> {{ page.next.title }} →</a>
            {% endif %}
        </div>
    </main>

    <footer style="text-align: center; margin-top: 40px;">
        <p>&copy; {{ 'now' | date: "%Y" }} Two Ticks</p>
    </footer>

    <button class="lamp-toggle" data-lamp type="button" aria-pressed="false" aria-label="Light the lamp">
      <span class="lamp-glow" aria-hidden="true"></span>
      <svg viewBox="0 0 44 92" aria-hidden="true">
      <line class="lamp-cord" x1="22" y1="0" x2="22" y2="16"/>
      <path class="lamp-cord" d="M22 16 C26.5 16 26.5 22.5 22 22.5 C17.5 22.5 17.5 16 22 16 Z" fill="none"/>
      <line class="lamp-cord" x1="22" y1="22.5" x2="22" y2="27"/>
      <path class="lamp-shade" d="M15 35.5 L29 35.5 L26 27 L18 27 Z"/>
      <rect class="lamp-bulb" x="13.5" y="35.5" width="17" height="26" rx="3.5"/>
      <line class="lamp-cord" x1="16.5" y1="36.5" x2="16.5" y2="61"/>
      <line class="lamp-cord" x1="27.5" y1="36.5" x2="27.5" y2="61"/>
      <path class="lamp-flame" d="M22 43.5 C25 47.2 25 52.2 22 54.8 C19 52.2 19 47.6 22 43.5 Z"/>
      <path class="lamp-shade" d="M12.5 61.5 L31.5 61.5 L29.5 67 L14.5 67 Z"/>
    </svg>
    </button>
    <script src="{{ '/assets/js/lamp.js' | relative_url }}" defer></script>

    <script>
      // A click on the desk around the sheet closes it and returns to the diary.
      (function () {
        var home = '{{ "/" | relative_url }}';
        document.addEventListener('click', function (event) {
          if (event.target.closest('.article-paper, .nav-bar, footer, a, button, input, form')) return;
          document.body.classList.add('is-closing');
          setTimeout(function () { window.location.href = home; }, 400);
        });
      })();
    </script>
</body>
</html>
